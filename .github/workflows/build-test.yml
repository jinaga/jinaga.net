name: "Build and Test"

on:
  push:
    branches: [ main ]
  # A stacked layer joins its stack after it opens, and joining fires no
  # workflow trigger, so the run from its own `opened` event is the only one it
  # is guaranteed. Leave `pull_request` unfiltered by base so that run happens.
  pull_request:

  # The escape hatch for a stacked pull request whose checks never fired.
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: "0"

    # Both version scripts read the release tags, which the checkout above
    # brings with fetch-depth 0 and a shallow clone lacks. That is why they run
    # here and not before a push.
    - name: Check declared versions
      run: bash .github/scripts/check-declared-versions.sh

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: |
        dotnet build Jinaga --no-restore
        dotnet build Jinaga.UnitTest --no-restore
        dotnet build Jinaga.Test --no-restore
        dotnet build Jinaga.Notebooks --no-restore
        dotnet build Jinaga.Notebooks.Test --no-restore
        dotnet build Jinaga.Tool --no-restore
        dotnet build Jinaga.Tool.TestLibrary --no-restore
        dotnet build Jinaga.Tool.Test --no-restore
        dotnet build Jinaga.Store.SQLite --no-restore
        dotnet build Jinaga.Store.SQLite.Test --no-restore
        dotnet build Jinaga.Maui --no-restore
        dotnet build Jinaga.Maui.Test --no-restore

    - name: Test
      run: |
        dotnet test Jinaga.Test --no-build --verbosity normal
        dotnet test Jinaga.Store.SQLite.Test --no-build --verbosity normal
        dotnet test Jinaga.Notebooks.Test --no-build --verbosity normal
        dotnet test Jinaga.Maui.Test --no-build --verbosity normal
        dotnet test Jinaga.Tool.Test --no-build --verbosity normal

    - name: Validate package APIs
      run: bash .github/scripts/validate-package-apis.sh
